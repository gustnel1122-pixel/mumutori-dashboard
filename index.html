const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptDashboard(password,payload){
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const packed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
 return await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
document.getElementById('unlock').addEventListener('submit',async event=>{
 event.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message'),input=document.getElementById('password');
 button.disabled=true;message.textContent='대시보드를 여는 중입니다…';
 try{
  if(!crypto.subtle||typeof DecompressionStream==='undefined')throw new Error('browser');
  const html=await decryptDashboard(input.value.trim(),JSON.parse(document.getElementById('encrypted-dashboard').textContent));
  input.value='';const frame=document.createElement('iframe');frame.title='무무토리 회사 관리';frame.srcdoc=html;document.body.appendChild(frame);document.getElementById('gate').remove();
 }catch(error){message.textContent=error.message==='browser'?'최신 Chrome 또는 Edge에서 열어 주세요.':'비밀번호를 확인해 주세요.';button.disabled=false;}
});
</script></body></html>
