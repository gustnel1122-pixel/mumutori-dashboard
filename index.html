function buildDailyPeriods(dates) {
  const ds = dates.slice().sort();
  const DOW2 = ['일', '월', '화', '수', '목', '금', '토'];
  const months = {}, weeks = {}, days = [];
  ds.forEach(d => {
    const m = d.slice(0, 7);
    if (!months[m]) months[m] = { key: m, s: m + '-01', e: m + '-31', label: m };
    const dt = new Date(d + 'T00:00:00');
    const mon = addDays(d, -((dt.getDay() + 6) % 7));
    if (!weeks[mon]) weeks[mon] = { key: mon, s: mon, e: addDays(mon, 6), label: mon.slice(5).replace('-', '/') + ' ~ ' + addDays(mon, 6).slice(5).replace('-', '/') + ' 주간' };
    days.push({ key: d, s: d, e: d, label: d + ' (' + DOW2[dt.getDay()] + ')' });
  });
  const desc = o => Object.values(o).sort((a, b) => b.key.localeCompare(a.key));
  return { month: desc(months), week: desc(weeks), day: days.reverse() };
}

const computeMargin = (price, avgCost, feeRate) => {
  const fee = Math.round(price * feeRate);
  const margin = Math.round(price - avgCost - fee);
  const marginRate = price ? Math.round(margin / price * 1000) / 10 : 0;
  return { margin, marginRate, fee };
};
const skuChannelMargin = (data, product, ch) => {
  const cpx = (product.channelPrices || {})[ch] || {};
  if (cpx.price == null || cpx.price === '') return { status: 'no-price' };
  if (cpx.feeRate == null || cpx.feeRate === '') return { status: 'no-fee', price: cpx.price };
  const inv = computeInventory(data, product.id);
  const r = computeMargin(cpx.price, inv.avgCost, cpx.feeRate);
  return { status: 'ok', price: cpx.price, feeRate: cpx.feeRate, avgCost: inv.avgCost, fee: r.fee, margin: r.margin, marginRate: r.marginRate };
};
const bundleComponents = row => (row && row.components) ? row.components : [];
const bundleAvgCostSum = (data, row) => bundleComponents(row).reduce((s, c) => s + computeInventory(data, c.sku).avgCost * (Number(c.qty) || 0), 0);
const bundleMargin = (data, row) => {
  if (row.price == null || row.price === '') return { status: 'no-price' };
  if (row.feeRate == null || row.feeRate === '') return { status: 'no-fee', price: row.price };
  const avgCost = bundleAvgCostSum(data, row);
  const r = computeMargin(row.price, avgCost, row.feeRate);

};

    setData(d => ({ ...d,
      products: (d.products || []).filter(x => x.id !== p.id),
      channelSkuMap: (d.channelSkuMap || []).filter(m => m.sku !== p.id),
      submaterialLinks: (d.submaterialLinks || []).filter(l => l.productId !== p.id && l.materialSku !== p.id),
    }));
  };
  const priceStr = cpx => CHANNELS.map(([ch, label]) => (cpx && cpx[ch] && cpx[ch].price) ? label[0] + ' ' + cpx[ch].price.toLocaleString() : null).filter(Boolean).join(' · ') || '-';

  const BUNDLE_SEED_ID = 'bundle-malrangi-1p1';
  const applyPricingSeed = () => {
    setData(d => {
      const products = (d.products || []).map(p => {
        const cp = p.channelPrices || emptyChannelPrices();
        const cur = cp.naver || { price: null, feeRate: null };
        const naverFee = cur.feeRate != null ? cur.feeRate : 0.0662;
        const naverPrice = cur.price != null ? cur.price : (NAVER_PRICE_SEED[p.id] != null ? NAVER_PRICE_SEED[p.id] : null);
        return { ...p, channelPrices: { ...cp, naver: { price: naverPrice, feeRate: naverFee } } };
      });
      const bundleRow = {
        id: BUNDLE_SEED_ID, isBundle: true, channel: 'naver', channelProductCode: '', channelOptionName: '1+1세트',

        components: [{ sku: 'TOY-001', qty: 1 }, { sku: 'TOY-002', qty: 1 }], active: true,
      };
      const channelSkuMap = [...(d.channelSkuMap || []).filter(m => m.id !== BUNDLE_SEED_ID), bundleRow];
      return { ...d, products, channelSkuMap };

                        </span>
                      )}
                    </div>
                  ))}
                  <span style={{ fontSize: 10, color: '#A29C95' }}>* 부자재 원가 미반영</span>
                </div>

            })()}

        );
      })}
      <div style={{ marginTop: 24 }}>

        </div>
        {bundles.length === 0 ? (
          <Card style={{ textAlign: 'center', padding: 24, color: '#A29C95', fontSize: 12 }}>등록된 세트상품이 없습니다</Card>
        ) : bundles.map(b => {
          const m = bundleMargin(data, b);
          const chLabel = (CHANNELS.find(c => c[0] === b.channel) || [b.channel, b.channel])[1];
          return (
            <Card key={b.id} style={{ marginBottom: 8 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>

                  <div style={{ fontWeight: 700, fontSize: 13 }}>{b.name}{b.channelOptionName ? ' · ' + b.channelOptionName : ''}</div>
                  <div style={{ fontSize: 11, color: '#6E6863', marginTop: 2 }}>{bundleComponents(b).map(c => c.sku + '×' + c.qty).join(' + ')}</div>
                </div>
                <div style={{ textAlign: 'right', minWidth: 90 }}>
                  <div style={{ fontSize: 11, color: '#A29C95' }}>세트판매가</div>
                  <div style={{ fontSize: 14, fontWeight: 800, color: G }}>{b.price != null ? won(b.price) : '-'}</div>
                </div>
                <div style={{ textAlign: 'right', minWidth: 130 }}>
                  <div style={{ fontSize: 11, color: '#A29C95' }}>마진</div>
                  {m.status === 'ok' ? (
                    <div style={{ fontSize: 14, fontWeight: 800, color: m.margin < 0 ? '#E53935' : (m.marginRate < LOW_MARGIN_THRESHOLD ? '#B45309' : G) }}>

                    </div>
                  ) : (
                    <div style={{ fontSize: 11, color: '#B45309' }}>{m.status === 'no-fee' ? '수수료율 입력 필요' : '판매가 입력 필요'}</div>
                  )}
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <EditBtn onClick={() => setEditSet(b)} />
                  <button onClick={() => { if (window.confirm('세트상품을 삭제할까요?')) setData(d => ({ ...d, channelSkuMap: (d.channelSkuMap || []).filter(x => x.id !== b.id) })); }} style={{ border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, color: '#E53935', cursor: 'pointer', fontSize: 10, padding: '2px 7px', fontWeight: 600 }}>삭제</button>
                </div>
              </div>
            </Card>
          );
        })}
      </div>
      {showAdd && <ProductFormModal data={data} setData={setData} onClose={() => setShowAdd(false)} />}
      {editP && <ProductFormModal data={data} setData={setData} edit={editP} onClose={() => setEditP(null)} />}
      {showSet && <SetFormModal data={data} setData={setData} onClose={() => setShowSet(false)} />}
      {editSet && <SetFormModal data={data} setData={setData} edit={editSet} onClose={() => setEditSet(null)} />}
    </div>
  );
}

                {sends.map((sd, i) => { const codes = sd.codes || []; const unsafe = codes.filter(c => !isSafeCode(c)); const safeCount = codes.length - unsafe.length; const sm = stMeta(sd.status || '예약'); const ckey = segId + ':' + i; return (
                  <div key={i} style={{ border: '1px solid #E3E0DC', borderRadius: 9, padding: '9px 11px', background: 'white' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 12.5, fontWeight: 700, color: '#1A1614' }}>📅 {sd.date || '-'}</span>
                      <span style={{ fontSize: 11, color: '#6E6863' }}>대상 {Number(sd.count != null ? sd.count : codes.length).toLocaleString()}명</span>
                      <button onClick={() => cycleStatus(segId, i)} style={{ marginLeft: 'auto', fontSize: 10, fontWeight: 800, color: sm.tx, background: sm.bg, border: '1px solid ' + sm.bd, borderRadius: 6, padding: '3px 10px', cursor: 'pointer' }}>{sd.status || '예약'} ⇄</button>
                    </div>
                    {unsafe.length > 0 ? <div style={{ fontSize: 10.5, color: '#DC2626', background: '#FEF2F2', border: '1px solid #FCA5A5', borderRadius: 7, padding: '5px 8px', marginTop: 6 }}>⚠ 코드 형식이 아닌 값 {unsafe.length}건 감지 — 실제 ID일 수 있어 숨겼습니다. 유니 확인 필요.</div> : null}
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 7, flexWrap: 'wrap' }}>
                      <button onClick={() => copyCodes(codes, ckey)} disabled={safeCount === 0} style={{ fontSize: 11, fontWeight: 700, color: copied === ckey ? '#047857' : 'white', background: copied === ckey ? '#ECFDF5' : (safeCount === 0 ? '#C4BFB9' : G), border: copied === ckey ? '1px solid #A7F3D0' : 'none', borderRadius: 6, padding: '4px 12px', cursor: safeCount === 0 ? 'default' : 'pointer' }}>{copied === ckey ? '✓ 복사됨' : '📋 코드 복사'}</button>
                      <span style={{ fontSize: 10.5, color: '#A29C95' }}>{safeCount.toLocaleString()}개 코드</span>
                      {codes.length > 0 ? (
                        <details style={{ marginLeft: 'auto' }}>
                          <summary style={{ fontSize: 10.5, color: '#2563EB', cursor: 'pointer', fontWeight: 600 }}>코드 보기</summary>
                          <div style={{ marginTop: 5, maxHeight: 140, overflowY: 'auto', background: '#F8F7F5', border: '1px solid #E3E0DC', borderRadius: 7, padding: '7px 9px', fontSize: 10.5, color: '#3A3631', fontFamily: 'monospace', lineHeight: 1.7, wordBreak: 'break-all' }}>{codes.map((c, k) => isSafeCode(c) ? <span key={k} style={{ marginRight: 8 }}>{c}</span> : <span key={k} style={{ marginRight: 8, color: '#DC2626', fontWeight: 700 }}>🔒숨김</span>)}</div>
                        </details>
                      ) : null}
                    </div>
                  </div>
                ); })}
              </div>
            )}
            {seg.updatedAt ? <div style={{ fontSize: 9.5, color: '#A29C95', textAlign: 'right', marginTop: 6 }}>갱신 {seg.updatedAt}</div> : null}
          </Card>
        );
      })}
    </div>
  );
}
const TAB_SLUG = { team: '팀 현황', weekly: '데일리/주간', progress: '프로젝트 진행 상황', kanban: '칸반', performance: '업무 성과', kpi: 'KPI', products: '상품관리', assets: '자산관리', stock: '재고현황', sales: '매출', kakao: '카카오', ads: '광고', trends: '키워드 트렌드', schedule: '발송 스케줄', meeting: '회의', hold: '보류', trash: '휴지통' };
function App() {
  const [tab, setTab] = useState(0);
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);
  const [modal, setModal] = useState(false);
  const [editStack, setEditStack] = useState([]);
  const [recordId, setRecordId] = useState(null);
  const [sync, setSync] = useState('loading');
  const [syncErr, setSyncErr] = useState('');
  const pendingRef = useRef(null);
  const lastSavedRef = useRef(null);
  // ===== 데이터 불러오기: Realtime Database(설정됐다면) 실시간 구독, 아니면 localStorage =====
  useEffect(() => {
    const db = getRtdb();
    if (db) {
      setSync('loading');
      const ref = db.ref(RTDB_PATH);
      const onVal = snap => {
        try {
          const val = snap.val();
          if (val && val.payload) {
            const remote = JSON.parse(val.payload);
            if (remote && remote.nid) {
              const m = migrateData(remote);
              const str = JSON.stringify(m);
              if (str !== lastSavedRef.current) { setData(m); lastSavedRef.current = str; }
            }
            setReady(true); setSync('ok');
          } else {
            // RTDB에 데이터가 없으면 기존 localStorage 데이터를 1회 마이그레이션
            const localRaw = localStorage.getItem(STORAGE_KEY);
            const local = localRaw ? JSON.parse(localRaw) : null;
            const init = (local && local.nid) ? migrateData(local) : INIT;
            const str = JSON.stringify(init);
            ref.set({ payload: str, updatedAt: Date.now() });
            setData(init); lastSavedRef.current = str;
            setReady(true); setSync('ok');
          }
        } catch (e) {
          setSyncErr(e.message || 'Realtime DB 처리 실패'); setSync('error');
          setData(d => d || INIT); setReady(true);
        }
      };
      const onErr = err => {
        // RTDB 접속 실패 시 localStorage로 폴백
        setSyncErr((err && err.message) || 'Realtime DB 연결 실패 — 로컬 저장으로 전환'); setSync('error');
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const remote = raw ? JSON.parse(raw) : null;
          if (remote && remote.nid) { const m = migrateData(remote); setData(m); lastSavedRef.current = JSON.stringify(m); }
          else setData(INIT);
        } catch (e2) { setData(INIT); }
        setReady(true);
      };
      ref.on('value', onVal, onErr);
      return () => ref.off('value', onVal);
    }
    // Realtime DB 미설정 — 기존 localStorage 전용 로직
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const remote = raw ? JSON.parse(raw) : null;
      if (remote && remote.nid) { const m = migrateData(remote); setData(m); lastSavedRef.current = JSON.stringify(m); }
      else { setData(INIT); lastSavedRef.current = null; }
      setReady(true); setSync('ok');
    } catch (e) {
      setSyncErr(e.message || '불러오기 실패'); setSync('error');
      setData(INIT); setReady(true);
    }
  }, []);
  // ===== 저장: localStorage(항상, 오프라인 캐시) + Realtime Database(설정됐다면, 디바운스) =====
  useEffect(() => {
    if (!ready || !data) return;
    const str = JSON.stringify(data);
    if (str === lastSavedRef.current) return;
    if (pendingRef.current) clearTimeout(pendingRef.current);
    setSync('saving');
    pendingRef.current = setTimeout(() => {
      try { localStorage.setItem(STORAGE_KEY, str); } catch (e) { /* 용량 초과 등은 무시, RTDB가 있으면 그쪽이 원본 */ }
      const db = getRtdb();
      if (db) {
        const ref = db.ref(RTDB_PATH);
        ref.set({ payload: str, updatedAt: Date.now() }).then(() => {
          lastSavedRef.current = str;
          setSync('ok');
        }).catch(e => { setSync('error'); setSyncErr(e.message || 'Realtime DB 저장 실패'); });
      } else {
        try {
          lastSavedRef.current = str;
          setSync('ok');
        } catch (e) {
          setSync('error'); setSyncErr(e.message || '저장 실패');
        }
      }
    }, 500);
  }, [data, ready]);
  const heldCount = data ? data.plans.filter(p => p.hold).length + data.subplans.filter(s => s.stage === '보류').length : 0;
  const trashCount = data ? (data.trash || []).length : 0;
  const TABS = [
    { icon: '👥', label: '팀 현황', C: TabTeam },
    { icon: '📅', label: '데일리/주간', C: TabWeekly },
    { icon: '📈', label: '프로젝트 진행 상황', C: TabProgress },
    { icon: '🗂️', label: '칸반', C: TabKanban },
    { icon: '🏆', label: '업무 성과', C: TabPerformance },
    { icon: '📊', label: 'KPI', C: TabKpi },
    { icon: '📦', label: '상품관리', C: TabProducts },
    { icon: '💰', label: '자산관리', C: TabAsset },
    { icon: '📊', label: '재고현황', C: TabStock },
    { icon: '💵', label: '매출', C: TabSales },
    { icon: '💬', label: '카카오', C: TabKakao },
    { icon: '📣', label: '광고', C: TabAds },
    { icon: '🔥', label: '키워드 트렌드', C: TabTrends },
    { icon: '📨', label: '발송 스케줄', C: TabSchedule },
    { icon: '🗓', label: '회의', C: TabMeeting },
    { icon: '⏸', label: '보류', C: TabHold, badge: heldCount },
    { icon: '🗑', label: '휴지통', C: TabTrash, badge: trashCount },
  ];
  useEffect(() => {
    const applyHash = () => { const raw = decodeURIComponent((window.location.hash || '').replace(/^#/, '')).trim(); if (!raw) return; const label = TAB_SLUG[raw.toLowerCase()] || raw; const i = TABS.findIndex(t => t.label === label); if (i >= 0) setTab(i); };
    applyHash();
    window.addEventListener('hashchange', applyHash);
    return () => window.removeEventListener('hashchange', applyHash);
  }, []);
  if (!ready || !data) return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: BG }}>
      <div style={{ textAlign: 'center', color: '#6E6863' }}><div style={{ fontSize: 44, marginBottom: 12 }}>🌰</div><div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>불러오는 중...</div><div style={{ fontSize: 12, color: '#A29C95' }}>무무토리 대시보드</div></div>
    </div>
  );
  const TabC = TABS[tab].C;
  return (
    <div style={{ minHeight: '100vh', background: BG }}>
      <div style={{ background: G, color: 'white', padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: '0 2px 8px rgba(0,0,0,0.2)', flexWrap: 'wrap' }}>
        <span style={{ fontSize: 22 }}>🌰</span>
        <div><div style={{ fontSize: 16, fontWeight: 800 }}>무무토리 대시보드</div><div style={{ fontSize: 11, opacity: 0.7 }}>무무토리 · 실시간 동기화 (Realtime DB) / 로컬 저장</div></div>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <SyncBadge status={sync} errMsg={syncErr} />
          {MEMBERS.map(m => <div key={m} style={{ width: 30, height: 30, borderRadius: '50%', background: GO, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, border: '2px solid rgba(255,255,255,0.25)' }}>{AV[m]}</div>)}
          {heldCount > 0 && <div onClick={() => setTab(TABS.findIndex(t => t.label === '보류'))} style={{ background: '#989088', borderRadius: 20, padding: '4px 10px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>⏸ {heldCount}</div>}
          <button onClick={() => setModal(true)} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: 'white', color: G, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>+ 업무 추가하기</button>
        </div>
      </div>
      <div style={{ background: 'white', boxShadow: '0 1px 4px rgba(0,0,0,0.07)', overflowX: 'auto' }}>
        <div style={{ display: 'flex', minWidth: 'max-content' }}>
          {TABS.map((t, i) => <button key={i} onClick={() => setTab(i)} style={{ padding: '11px 18px', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: tab === i ? 700 : 500, color: tab === i ? G : '#6E6863', background: 'transparent', borderBottom: tab === i ? '2.5px solid ' + G : '2.5px solid transparent', display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>{t.icon} {t.label}{t.badge > 0 ? <span style={{ background: '#989088', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{t.badge}</span> : null}</button>)}
        </div>
      </div>
      <div style={{ maxWidth: 1400, margin: '0 auto' }}>
        <TabC data={data} setData={setData} onEdit={t => setEditStack([t])} onRecord={id => setRecordId(id)} goTab={label => { const i = TABS.findIndex(t => t.label === label); if (i >= 0) setTab(i); }} />
      </div>
      {modal && <AddModal data={data} setData={setData} onClose={() => setModal(false)} />}
      {editStack.length > 0 && (() => { const cur = editStack[editStack.length - 1]; return <EditModal key={cur.kind + '-' + cur.id} target={cur} data={data} setData={setData} onClose={() => setEditStack([])} onSwitch={t => setEditStack(s => [...s, t])} canBack={editStack.length > 1} onBack={() => setEditStack(s => s.slice(0, -1))} />; })()}
      {recordId && <PerfModal subId={recordId} data={data} setData={setData} onClose={() => setRecordId(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
