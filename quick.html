<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#174d3c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="무무 장부"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://mumutori-letter-default-rtdb.asia-southeast1.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; object-src 'none'; frame-src https://mumutori-letter.firebaseapp.com https://accounts.google.com; form-action 'none'; base-uri 'self'"><title>재무 빠른 장부 — 무무토리 스튜디오</title><link rel="icon" href="assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="src/quick.css?v=fin1"></head>
<body data-page="quick">
<header class="q-top"><a class="q-back" href="finance.html" aria-label="재무 화면으로">←</a><div><b>무무 장부</b><small>공용 장부 · 사장님 전용</small></div><span id="q-conn" class="q-conn" role="status">확인 중</span></header>
<main id="q-main" class="q-main">
  <section id="q-login" class="q-card" hidden><h1>로그인이 필요해요</h1><p>재무 장부는 사장님 구글 계정으로만 열려요.</p><button id="q-signin" class="q-btn q-primary" type="button">구글로 로그인</button><p id="q-login-msg" class="q-msg" role="alert"></p></section>
  <section id="q-app" hidden>
    <a id="q-needs" class="q-needs" href="#q-needs-list" hidden>분류 필요 <b>0</b>건 →</a>
    <div class="q-tabs" role="tablist"><button type="button" role="tab" data-period="today" aria-selected="false">오늘</button><button type="button" role="tab" data-period="month" aria-selected="true">이번 달</button></div>
    <div id="q-sum" class="q-sum"></div>
    <form id="q-form" class="q-card q-form" autocomplete="off">
      <h2>빠른 입력</h2>
      <label class="q-amount"><span class="sr">금액</span><input id="q-amt" inputmode="numeric" pattern="[0-9,]*" placeholder="금액" aria-label="금액(원)"><em>원</em></label>
      <div class="q-row" role="radiogroup" aria-label="결제 수단" id="q-methods"></div>
      <div class="q-row q-cats" role="radiogroup" aria-label="분류" id="q-cats"></div>
      <details class="q-more"><summary>더보기 (날짜 · 거래처 · 메모 · 영수증 · 부가세)</summary>
        <label>날짜 <input id="q-date" type="date"></label>
        <label>거래처 <input id="q-vendor" list="q-vendors" maxlength="60" placeholder="예: 아이템스카우트"><datalist id="q-vendors"></datalist></label>
        <label>메모 <input id="q-memo" maxlength="300"></label>
        <label>증빙 <select id="q-evid"></select></label>
        <label class="q-check"><input id="q-vat" type="checkbox" checked> 부가세 포함 금액</label>
        <label class="q-check"><input id="q-in" type="checkbox"> 들어온 돈(매출 · 자금 충전 등)</label>
        <label>영수증 사진 <input id="q-photo" type="file" accept="image/*" capture="environment"></label>
      </details>
      <button id="q-save" class="q-btn q-primary q-save" type="submit">저장</button>
      <p id="q-form-msg" class="q-msg" role="alert"></p>
    </form>
    <section id="q-needs-list" class="q-card" hidden><h2>분류 필요</h2><div id="q-needs-rows"></div></section>
    <section class="q-card"><h2>최근 기록</h2><div id="q-recent"></div></section>
  </section>
</main>
<script src="assets/vendor/firebase/firebase-app-compat.js"></script><script src="assets/vendor/firebase/firebase-auth-compat.js"></script><script src="src/fin-core.js?v=fin1"></script><script type="module" src="src/quick.js?v=fin1"></script>
</body></html>
